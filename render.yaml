# =====================================================================
# Render Infrastructure as Code (render.yaml)
# INNOVORTEX 4.0: EDAgent on Nonilion
# =====================================================================

services:
  - type: web
    name: edagent
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-20241022
      - key: NONILION_API_KEY
        sync: false
      - key: NONILION_BOT_ID
        value: edagent-bot
      - key: NONILION_BASE_URL
        value: https://www.nonilion.com/api/v1
      - key: MPLBACKEND
        value: Agg

# =====================================================================
